name: trainer_app
description: Trainer App - Coach-facing Flutter application for WTF fitness platform.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared:
    path: ../shared
  provider: ^6.1.2
  go_router: ^13.2.0
  flutter_animate: ^4.5.0
  package_info_plus: ^8.0.0
  intl: ^0.18.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.0
  uuid: ^4.4.0
  http: ^1.2.1
  hmssdk_flutter: ^1.11.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
